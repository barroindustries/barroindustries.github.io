<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// Applied before first paint to avoid a flash of the wrong theme on a repeat
// visit. Mirrors the three-way pattern in the stylesheet below: an explicit
// stored choice wins; no stored choice = follow the OS via the media query.
try {
  var __t = localStorage.getItem("bkportal_theme");
  if (__t === "light" || __t === "dark") document.documentElement.setAttribute("data-theme", __t);
} catch (_e) {}
</script>
<title>Project Confirmation — Barro Kitchens</title>
<meta name="robots" content="noindex,nofollow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;0,700;1,600&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================================
   THEMING — three-state pattern copied from partners/pmtc/chibabs/schematic/index.html
   (per CLIENT-PORTAL-CHIBABS-SPEC.md §5.2), so this page reads as the same
   Barro Kitchens family:
     1) bare :root                               → light values (also the default
                                                     when the browser has no preference)
     2) @media(prefers-color-scheme:dark)
        guarded by :root:not([data-theme="light"]) → auto-dark, UNLESS the visitor
                                                        explicitly forced light
     3) :root[data-theme="dark"]                 → explicit forced-dark wins over all
   Every token has a bare :root definition first — never defined only inside a
   media query — so a browser with no prefers-color-scheme support still renders
   correct light colors, and the inline head script above can apply a stored
   choice before first paint without waiting on this stylesheet.
   ========================================================================= */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --ink:#1B2226; --muted:#5B676E; --line:#C9D1D6; --soft:#E6EAEC;
  --ember:#D9661F; --ember-ink:#FFFFFF;
  --z-cook:#C93F2A; --z-prep:#2F8A52; --z-store:#2F6FB8; --z-dish:#1A8C92; --z-foh:#6D55A8; --z-waste:#6B7479;
  --ok:#2F8A52; --warn:#B98900; --danger:#C93F2A;
  --focus:#2F6FB8;
  --r:10px; --shadow:0 2px 10px rgba(20,24,26,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111619; --surface:#192125; --ink:#E4EAED; --muted:#93A1A8; --line:#34424A; --soft:#222C31;
    --ember:#F08A45; --ember-ink:#1B1200;
    --z-cook:#F07560; --z-prep:#5CC285; --z-store:#6AA6EC; --z-dish:#4FC3C8; --z-foh:#A48BE0; --z-waste:#9AA5AB;
    --ok:#5CC285; --warn:#E5B34A; --danger:#F07560;
    --focus:#6AA6EC;
    --shadow:0 2px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#111619; --surface:#192125; --ink:#E4EAED; --muted:#93A1A8; --line:#34424A; --soft:#222C31;
  --ember:#F08A45; --ember-ink:#1B1200;
  --z-cook:#F07560; --z-prep:#5CC285; --z-store:#6AA6EC; --z-dish:#4FC3C8; --z-foh:#A48BE0; --z-waste:#9AA5AB;
  --ok:#5CC285; --warn:#E5B34A; --danger:#F07560;
  --focus:#6AA6EC;
  --shadow:0 2px 14px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.55 Barlow,"Helvetica Neue",Arial,sans-serif;
  padding-inline:16px; /* ≥16px side gutter at every width */
  padding-block:20px 84px;
  min-height:100dvh;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,h4{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;margin:0;text-wrap:balance;letter-spacing:.01em;color:var(--ink)}
h1{font-size:clamp(22px,5.2vw,30px);font-weight:700;line-height:1.12}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--z-store)}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.card > .card-head{display:flex;flex-direction:column;gap:4px}
.hr{border:none;border-top:1px solid var(--line);margin:2px 0}
.scrollx{overflow-x:auto} /* long tables get their own horizontal-scroll container — the page itself never scrolls sideways */

a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible,
select:focus-visible, summary:focus-visible, [tabindex]:focus-visible, canvas:focus-visible{
  outline:2px solid var(--focus); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important}
}

/* ── brand bar + theme toggle ──────────────────────────── */
.brandbar{display:flex;align-items:center;gap:12px;padding:4px 2px}
.brandbar .mark{width:38px;height:38px;border-radius:8px;background:var(--ember);color:var(--ember-ink);
  display:grid;place-items:center;font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:15px;flex:0 0 auto}
.brandbar .name{font-weight:700;font-size:15px;line-height:1.2}
.brandbar .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.theme-toggle{margin-left:auto;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:16px;flex:0 0 auto}

/* ── header / identity ─────────────────────────────────── */
header.hd{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.hd-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--muted)}
.hd-meta b{color:var(--ink);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--ember) 16%,var(--surface));color:var(--ember);border:1px solid color-mix(in srgb,var(--ember) 40%,var(--surface));width:fit-content}
.badge.warn{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn);border-color:var(--warn)}
.badge.danger{background:color-mix(in srgb,var(--danger) 18%,var(--surface));color:var(--danger);border-color:var(--danger)}

/* ── headline / stats ──────────────────────────────────── */
.headline{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.headline .amt{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:clamp(34px,9vw,50px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.headline .amt .cur{font-size:.55em;vertical-align:.12em;color:var(--muted);margin-right:2px}
.headline .note{font-size:13px;color:var(--muted);max-width:56ch}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stat .v{font-size:15px;font-weight:700;font-family:"Barlow Semi Condensed",sans-serif}

/* ── workflow blocks ───────────────────────────────────── */
.wf-list{display:flex;flex-direction:column;gap:10px}
.wf{display:flex;gap:12px;border-left:4px solid var(--zc,var(--ember));background:var(--soft);border-radius:0 8px 8px 0;padding:12px 14px}
.wf .wf-no{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--zc,var(--ember));font-weight:600;flex:0 0 auto;padding-top:2px}
.wf .wf-title{font-weight:700;font-size:14.5px}
.wf .wf-desc{font-size:13.5px;color:var(--muted);max-width:62ch}

/* ── equipment schedule ─────────────────────────────────── */
.eq-note{font-size:12.5px;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.zone-acc{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zone-acc + .zone-acc{margin-top:8px}
.zone-acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-left:5px solid var(--zc,var(--muted));background:var(--soft)}
.zone-acc summary::-webkit-details-marker{display:none}
.zone-acc summary .chev{margin-left:auto;font-size:13px;color:var(--muted);transition:transform .15s}
.zone-acc[open] summary .chev{transform:rotate(90deg)}
.zone-acc summary .zt{display:flex;flex-direction:column;gap:1px}
.zone-acc summary .zt b{font-size:14.5px}
.zone-acc summary .zt span{font-size:11.5px;color:var(--muted)}
.zone-acc.optional summary{opacity:.85}
.zone-acc .zone-items{padding:6px 14px 12px;display:flex;flex-direction:column;gap:0}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .item-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .item-no{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--zc,var(--muted));font-weight:600}
.item .item-title{font-weight:600;font-size:14px}
.item .item-dims{font-size:12px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.item .item-notes{font-size:13px;color:var(--muted);margin-top:3px;max-width:64ch}
.item .item-utils{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.util-chip{font-size:11px;font-family:"JetBrains Mono",monospace;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.util-chip.cost{border-color:var(--warn);color:var(--warn)}

/* ── milestones table ───────────────────────────────────── */
table.ms{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.ms th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  padding:0 8px 8px;border-bottom:2px solid var(--line)}
table.ms td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.ms tr.foot td{border-bottom:none;font-weight:700;padding-top:12px}
table.ms .num{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
table.ms tr.part td{padding:4px 8px 4px 20px;color:var(--muted);font-size:12.5px;border-bottom:none}
.marker{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.marker.fixed{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.marker.restated{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}
.ms-legend{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ── reusable timeline component ────────────────────────── */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl-step{display:flex;gap:12px;position:relative;padding-bottom:18px}
.tl-step:last-child{padding-bottom:0}
.tl-line{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl-step:last-child .tl-line{display:none}
.tl-step.done .tl-line, .tl-step.current .tl-line{background:var(--ember)}
.tl-dot{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--soft);color:var(--muted);border:2px solid var(--line);z-index:1;font-family:"JetBrains Mono",monospace}
.tl-step.done .tl-dot{background:var(--ok);color:#fff;border-color:var(--ok)}
.tl-step.current .tl-dot{background:var(--ember);color:var(--ember-ink);border-color:var(--ember);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--ember) 24%,transparent);animation:tlpulse 1.8s ease-in-out infinite}
@keyframes tlpulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ember) 24%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--ember) 10%,transparent)}}
@media (prefers-reduced-motion: reduce){.tl-step.current .tl-dot{animation:none}}
.tl-body{padding-top:2px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.tl-date{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.tl-title{font-weight:700;font-size:14.5px}
.tl-step.pending .tl-title{color:var(--muted)}
.tl-desc{font-size:13px;color:var(--muted);max-width:62ch}
.tl-note{font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin-top:2px}
.tl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tl-tag{font-size:10.5px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tl-tag.yours{color:var(--ember);border:1px solid var(--ember);font-family:Barlow,sans-serif;font-weight:600}
.tl-tag.barro{color:var(--ink);border:1px solid var(--ink);font-family:Barlow,sans-serif;font-weight:600}
.tl-tag.pay{color:var(--ink);background:var(--soft);font-family:"JetBrains Mono",monospace;border:1px solid var(--line)}

/* ── terms ──────────────────────────────────────────────── */
.terms-list{display:flex;flex-direction:column;gap:10px}
.term{display:flex;flex-direction:column;gap:4px}
.term h4{font-size:13.5px}
.term p{font-size:13.5px;color:var(--muted);max-width:66ch}
.terms-more{display:flex;flex-direction:column;gap:10px}
.terms-more[hidden]{display:none}
.btn-textlink{background:none;border:none;color:var(--z-store);font:600 13.5px Barlow,sans-serif;cursor:pointer;padding:4px 0;text-align:left}

/* ── included / not included ────────────────────────────── */
.inc-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.inc-grid{grid-template-columns:1fr 1fr}}
.inc-col{display:flex;flex-direction:column;gap:8px}
.inc-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.inc-col.yes h4{color:var(--ok)}
.inc-col.no h4{color:var(--danger)}
.inc-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.inc-col li{font-size:13px;display:flex;gap:8px;align-items:flex-start}
.inc-col li .ic{flex:0 0 auto;font-weight:700}
.inc-col.yes li .ic{color:var(--ok)}
.inc-col.no li .ic{color:var(--danger)}

/* ── privacy panel ──────────────────────────────────────── */
.priv-panel{border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.priv-panel summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.priv-panel summary::-webkit-details-marker{display:none}
.priv-panel summary .chev{margin-left:auto;color:var(--muted);font-size:12px}
.priv-panel[open] summary .chev{transform:rotate(90deg)}
.priv-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
.priv-body h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin:0}
.priv-ver{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}

/* ── form ───────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600}
.field .req{color:var(--danger)}
.field input[type=text], .field input[type=email], .field input[type=tel]{
  font:inherit;font-size:15px;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-height:44px;
}
.field input[aria-invalid=true]{border-color:var(--danger)}
.field-err{font-size:12px;color:var(--danger);min-height:15px}
.field-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.field-grid{grid-template-columns:1fr 1fr}}
.field-grid .full{grid-column:1/-1}

.agree-row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line)}
.agree-row:first-of-type{border-top:none}
.agree-row input[type=checkbox]{margin-top:3px;flex:0 0 auto;width:19px;height:19px;min-width:19px}
.agree-row label{cursor:pointer}

/* ── signature pad ──────────────────────────────────────── */
.sig-wrap{display:flex;flex-direction:column;gap:8px}
.sig-switch{background:none;border:none;color:var(--z-store);font:600 13px Barlow,sans-serif;cursor:pointer;padding:2px 0;text-align:left;width:fit-content}
.sig-canvas-box{border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);position:relative;touch-action:pan-y}
.sig-canvas-box canvas{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair;border-radius:8px}
.sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none}
.sig-typed-preview{width:100%;height:180px;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;padding:12px;text-align:center}
.sig-typed-preview span{font-family:"Barlow Semi Condensed",sans-serif;font-style:italic;font-weight:600;font-size:clamp(20px,6vw,34px);color:var(--ink);word-break:break-word}
.sig-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sig-size{font-size:11.5px;color:var(--muted);margin-left:auto;font-family:"JetBrains Mono",monospace}

/* ── buttons ────────────────────────────────────────────── */
.btn{font:600 14px Barlow,Arial,sans-serif;padding:12px 18px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink)}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ── state cards ────────────────────────────────────────── */
.state-card{text-align:center;padding:44px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.state-card .ic{font-size:38px}
.state-card h2{font-size:18px}
.state-card p{color:var(--muted);max-width:46ch}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ember);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none;border-top-color:var(--line)}}

.code-input{font:600 22px "JetBrains Mono",monospace;letter-spacing:.12em;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;text-transform:uppercase}
.err-slot{font-size:13px;color:var(--danger);min-height:18px}
.lockout-slot{font-size:13.5px;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid var(--warn);border-radius:8px;padding:12px;text-align:center}
.lockout-slot .cd{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;display:block;margin-top:4px}
.lost-code{font-size:13px;color:var(--muted);text-align:center}

/* ── sticky sign bar ────────────────────────────────────── */
.signbar{position:sticky;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:12px 16px;display:flex;align-items:center;gap:12px;
  margin:0 -16px;border-radius:0}
.signbar .txt{font-size:13px;font-weight:600;flex:1;min-width:0}
.signbar .txt small{display:block;font-weight:400;color:var(--muted)}

/* ── receipt ────────────────────────────────────────────── */
.receipt-ref{font-family:"JetBrains Mono",monospace;font-size:21px;font-weight:700;letter-spacing:.03em}
.receipt-kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.receipt-kv dt{color:var(--muted)}
.receipt-kv dd{margin:0;font-weight:600}
.sig-preview-img{max-width:280px;max-height:120px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px}
.agree-check-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.agree-check-list li{display:flex;gap:6px}
.agree-check-list li .ic{color:var(--ok);font-weight:700}

/* ── payments / updates ─────────────────────────────────── */
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.pay-row:first-child{border-top:none}
.pay-row .st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.pay-row .st.received{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.pay-row .st.due{background:color-mix(in srgb,var(--muted) 16%,var(--surface));color:var(--muted)}
.upd{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.upd:first-child{border-top:none}
.upd .upd-date{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.upd .upd-title{font-weight:700;font-size:14px}
.upd .upd-body{font-size:13px;color:var(--muted)}
.upd-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.upd-photos a{display:block;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.upd-photos img{display:block;width:100%;height:100px;object-fit:cover}

/* ── footer ─────────────────────────────────────────────── */
.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:10px 6px;line-height:1.6}

/* ── print — the client saves the receipt as a PDF via the browser's own Print
   dialog; js/pdf-lite.js is not loadable here (outside the app shell), so this
   is the only PDF path available. body.print-receipt is toggled on right
   before window.print() and removed on `afterprint`. ── */
@media print{
  body.print-receipt > .wrap > *:not(#receipt){display:none !important}
  body.print-receipt #receipt{box-shadow:none;border-color:#999;color:#000;background:#fff}
  body.print-receipt{background:#fff}
  .no-print{display:none !important}
}

    var stored = null;

    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";

    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("bkportal_theme", next); } catch (_e) {}

function mockDeepClone(x){ return JSON.parse(JSON.stringify(x)); }

// MOCK-ONLY persistence (localStorage) so signing, reloading and revisiting
// can all be demonstrated offline before the real backend exists. The real
// seam has no client-side persistence beyond the opaque viewer token.
var MOCK_LS_KEY = "chibabs_mock_portal_db_v2";
function mockDb(){ try { return JSON.parse(localStorage.getItem(MOCK_LS_KEY) || "null") || {}; } catch (_e) { return {}; } }
function mockDbSave(db){ try { localStorage.setItem(MOCK_LS_KEY, JSON.stringify(db)); } catch (_e) {} }
// Access-code alphabet — MUST stay byte-identical to CODE_ALPHABET in
// functions/portal-core.js. The filter regex is DERIVED from it, never
// hand-written: it previously read /[^A-HJ-NP-TV-Z2-9]/, whose ranges skip U
// (it sits between T and V, so it was in neither) and wrongly admit L. That
// silently ate a valid character out of ~23% of real codes — a code with a U
// in it could not be typed in at all — and accepted an L the server rejects.
var CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
var CODE_STRIP_RE = new RegExp("[^" + CODE_ALPHABET + "]", "g");
function normalizeCodeInput(v){ return String(v == null ? "" : v).toUpperCase().replace(CODE_STRIP_RE, ""); }

function mockRefNo(){
  var d = new Date();
  var yy = String(d.getFullYear()).slice(2), mm = pad2(d.getMonth() + 1), dd = pad2(d.getDate());
  var rand = "";
  for (var i = 0; i < 6; i++) rand += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
  return "BKC-" + yy + mm + dd + "-" + rand;
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function delay(ms){ return new Promise(function (res) { setTimeout(res, ms); }); }

function mockBuildState(acceptance, progress){
  return {
    portal: mockDeepClone(CONTENT.portal),
    acceptance: acceptance || null,
    progress: progress || { currentStep: 0, steps: {}, payments: [], updates: [] },
    privacyNotice: mockDeepClone(CONTENT.privacyNotice),
    server: { now: new Date().toISOString(), today: new Date().toISOString().slice(0, 10), expired: SIM === "expired" }
  };
}

/* ============================================================================
   4. THE INTEGRATION SEAM — Portal.unlock / Portal.loadState / Portal.sign.
   Everything the page needs from the backend goes through these three
   methods. Under ?mock=1 they resolve from the fixture above (with the
   `sim` QA hooks); otherwise they are the real `asia-east1` httpsCallable
   functions per spec §2. Swapping mock↔real never touches a render function.
   ========================================================================= */
var fbApp = null, fnUnlock = null, fnState = null, fnSign = null;
function ensureFirebase(){
  if (fbApp) return;
  fbApp = firebase.initializeApp(FIREBASE_CFG);
  var fns = firebase.app().functions(REGION);
  fnUnlock = fns.httpsCallable("portalUnlock");
  fnState = fns.httpsCallable("portalState");
  fnSign = fns.httpsCallable("portalSign");
}
// Normalizes both a real firebase.functions HttpsError and a mock-mode
// rejection into the same {code, message} shape the UI switches on.
function normalizeError(e){
  return { code: (e && e.code) || "internal", message: (e && e.message) || "Something went wrong. Please try again." };
}

var Portal = {
  unlock: function (code) {
    if (MOCK_MODE) {
      return delay(SIM === "loading" ? 2200 : 500).then(function () {
        var normalized = normalizeCodeInput(code);
        if (normalized.length !== 8) {
          return Promise.reject({ code: "permission-denied", message: "That access code isn't right." });
        }
        // Deterministic per-code token (not random) so that unlocking with the
        // SAME code twice — e.g. a revisit that skipped the localStorage token
        // — reproduces the SAME mock db record, exactly like a real backend
        // would recognize the same signer. This is also what lets `sim=signed`
        // / `sim=progress` apply on the very FIRST unlock, not only on a
        // second loadState() call.
        var token = "mock." + btoa(normalized).replace(/=+$/, "");
        var db = mockDb();
        var rec = db[token] || null;
        var forcedFixture = (SIM === "signed" || SIM === "progress");
        var state = mockBuildState(rec ? rec.acceptance : (forcedFixture ? mockSignedFixture() : null), rec ? rec.progress : (forcedFixture ? mockProgressFixture() : null));
        return { ok: true, viewerToken: token, expiresAt: new Date(Date.now() + 90 * 86400000).toISOString(), state: state };
      });
    }
    ensureFirebase();
    return fnUnlock({ portalId: PORTAL_ID, code: code }).then(function (r) { return r.data; }).catch(function (e) { return Promise.reject(normalizeError(e)); });
  },

  loadState: function (viewerToken) {
    if (MOCK_MODE) {
      return delay(SIM === "loading" ? 1800 : 350).then(function () {
        if (SIM === "error") return Promise.reject({ code: "unavailable", message: "Something went wrong on our side — please try again in a moment." });
        if (SIM === "unauthenticated") return Promise.reject({ code: "unauthenticated", message: "Please enter your access code again." });
        var db = mockDb();
        var rec = db[viewerToken] || null;
        // `sim=signed` and `sim=progress` both seed a non-trivial in-flight
        // project (payments recorded, an update posted) so the richer
        // progress view can be verified without signing first; `sim=progress`
        // additionally starts further along (current step 4) than a
        // freshly-signed portal would be.
        var forcedFixture = (SIM === "signed" || SIM === "progress");
        return { ok: true, state: mockBuildState(rec ? rec.acceptance : (forcedFixture ? mockSignedFixture() : null), rec ? rec.progress : (forcedFixture ? mockProgressFixture() : null)) };
      });
    }
    ensureFirebase();
    return fnState({ portalId: PORTAL_ID, viewerToken: viewerToken }).then(function (r) { return r.data; }).catch(function (e) { return Promise.reject(normalizeError(e)); });
  },

  sign: function (payload) {
    if (MOCK_MODE) {
      return delay(1200).then(function () {
        var db = mockDb();
        var refNo = mockRefNo();
        var signedAt = new Date().toISOString();
        var acceptance = {
          refNo: refNo, signedAt: signedAt,
          signer: { name: payload.signer.name, email: payload.signer.email, phone: payload.signer.phone, designation: payload.signer.designation, company: payload.signer.company },
          typedName: payload.typedName, signatureMode: payload.signatureMode, signaturePng: payload.signaturePng,
          agreements: payload.agreements,
          privacy: { noticeVersion: payload.privacy.noticeVersion, consentedAt: signedAt }
        };
        var progress = { currentStep: 1, steps: { "1": { state: "current", on: signedAt.slice(0, 10), note: "" } },
          payments: [], updates: [] };
        db[payload.viewerToken] = { acceptance: acceptance, progress: progress };
        mockDbSave(db);
        return { ok: true, receipt: { refNo: refNo, signedAt: signedAt, signerName: payload.signer.name, signerEmail: payload.signer.email, proposalNumber: CONTENT.portal.proposal.number, contractTotal: CONTENT.portal.figures.contractTotal, noticeVersion: payload.privacy.noticeVersion }, state: mockBuildState(acceptance, progress) };
      });
    }
    ensureFirebase();
    return fnSign(payload).then(function (r) { return r.data; }).catch(function (e) { return Promise.reject(normalizeError(e)); });
  }
};

/* ============================================================================
   5. HELPERS — esc()/peso()/fmtDate() follow the exact conventions used in
   q/index.html and t/index.html. Every interpolated value on this page,
   including everything that comes back from the server over the seam above,
   passes through esc(). Treat all of it as untrusted.
   ========================================================================= */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function peso(n){
  n = Number(n) || 0;
  return "₱" + n.toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
// ISO 'YYYY-MM-DD' → 'Sep 26, 2026', parsed as local midnight (never raw
// `new Date(iso)` on a bare date, which UTC-shifts and can print the wrong
// calendar day — see q/index.html's fmtDate and the repo's Manila-time notes).
function fmtDate(iso){
  if (!iso) return "";
  var d = new Date(String(iso).length <= 10 ? iso + "T00:00:00" : iso);
  if (isNaN(d)) return esc(String(iso));
  return d.toLocaleDateString("en-PH", { year: "numeric", month: "short", day: "numeric" });
}
function fmtDateTime(iso){
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d)) return esc(String(iso));
  return d.toLocaleString("en-PH", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function daysUntil(iso){
  if (!iso) return null;
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return null;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.ceil((d - today) / 86400000);
}
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || "").trim()); }
function zoneColorVar(colorKey){
  var map = { cook: "--z-cook", prep: "--z-prep", store: "--z-store", dish: "--z-dish", foh: "--z-foh", opt: "--z-waste" };
  return "var(" + (map[colorKey] || "--muted") + ")";
}
function zoneByNo(portal, no){
  var zs = portal.zones || [];
  for (var i = 0; i < zs.length; i++) if (zs[i].no === no) return zs[i];
  return null;
}
function milestoneByKey(portal, key){
  var ms = portal.milestones || [];
  for (var i = 0; i < ms.length; i++) if (ms[i].key === key) return ms[i];
  return null;
}

/* ============================================================================
   6. STATE MACHINE (spec §5.3)
   render states: loading | locked | link-error | review | signed
   "submitting" and the sign sheet are in-place UI conditions within
   `review`/`locked`, not separate full-page states — matching the frozen
   transition diagram (buttons disable + relabel in flight; nothing swaps
   the whole page except on an actual state change).
   ========================================================================= */
var STATE = "loading";
var CTX = {
  viewerToken: null,
  data: null,          // { portal, acceptance, progress, privacyNotice, server } — the exact `state` shape
  lockoutUntil: 0,      // epoch ms; > now while locked out
  lockoutTimer: null,
  lockedBanner: "",     // e.g. "Your session ended — enter your code again"
  linkErrorText: "",
  signSheetOpen: false,
  signatureMode: "drawn",
  freshlySigned: false,
  lastReceipt: null
};
var app = document.getElementById("app");

function goto(state){ STATE = state; render(); }
function render(){
  var html;
  switch (STATE) {
    case "loading":    html = renderLoadingView(); break;
    case "link-error": html = renderLinkErrorView(); break;
    case "locked":     html = renderLockedView(); break;
    case "review":     html = renderReviewView(); break;
    case "signed":     html = renderSignedView(); break;
    default:           html = renderLinkErrorView();
  }
  app.innerHTML = html;
  wireCurrentView();
}

function tokenKey(){ return LS_TOKEN_PREFIX + PORTAL_ID; }
function storedToken(){ try { return localStorage.getItem(tokenKey()); } catch (_e) { return null; } }
function storeToken(t){ try { localStorage.setItem(tokenKey(), t); } catch (_e) {} }
function clearToken(){ try { localStorage.removeItem(tokenKey()); } catch (_e) {} }

/* ---- boot (spec §5.3) --------------------------------------------------- */
function boot(){
  if (!PORTAL_ID) {
    CTX.linkErrorText = "This link looks incomplete. Please use the exact link Barro Kitchens sent you.";
    goto("link-error");
    return;
  }
  goto("loading");
  var tok = storedToken();
  if (!tok) { goto("locked"); return; }
  CTX.viewerToken = tok;
  Portal.loadState(tok).then(function (res) {
    CTX.data = res.state;
    goto(res.state.acceptance ? "signed" : "review");
  }).catch(function (err) {
    if (err.code === "unauthenticated") {
      clearToken();
      CTX.lockedBanner = "Your session ended — enter your code again.";
      goto("locked");
    } else if (err.code === "not-found") {
      CTX.linkErrorText = err.message || "This link isn't active.";
      goto("link-error");
    } else {
      CTX.linkErrorText = (err.code === "unavailable" || err.code === "internal")
        ? "Something went wrong on our side — please try again in a moment."
        : (err.message || "Could not load your project.");
      goto("link-error");
    }
  });
}

    return '<details class="zone-acc' + (isOptional ? " optional" : "") + '"' + (isOptional ? "" : " open") + '>' +
      '<summary style="--zc:' + zoneColorVar(z.colorKey) + '">' +
        '<span class="zt"><b>' + esc(z.name) + (isOptional ? " — to be priced on request, excluded from the contract total" : "") + "</b><span>" + esc(countLabel) + " · plan colour: " + esc(z.planColour) + "</span></span>" +
        '<span class="chev" aria-hidden="true">›</span>' +
      "</summary>" +
      '<div class="zone-items">' + itemsHtml + "</div>" +
    "</details>";
  }).join("");

/* Reusable timeline component (spec §5.5.6 / §5.8) — shared by REVIEW (all
   steps pending) and the progress view within SIGNED (real per-step state
   from `progress.steps`). The PAYMENT TRIGGER chip is derived here from
   `step.milestoneKey` looked up against `portal.milestones`, so it can never
   drift from the milestones table above it. */
function renderTimeline(portal, steps, stepStates){
  stepStates = stepStates || {};
  var items = (steps || []).map(function (step) {
    var st = stepStates[step.no] || stepStates[String(step.no)] || { state: "pending" };
    var cls = st.state || "pending";
    var mark = cls === "done" ? "✓" : String(step.no);
    var tagsHtml = (step.tags || []).map(function (t) {
      var cls2 = t.who === "client" ? "yours" : "barro";
      return '<span class="tl-tag ' + cls2 + '">' + esc(t.text) + "</span>";
    }).join("");
    if (step.milestoneKey) {
      var m = milestoneByKey(portal, step.milestoneKey);
      if (m) tagsHtml += '<span class="tl-tag pay">' + esc(m.key) + (m.restated ? " (±)" : "") + " — " + esc(m.pct) + "%</span>";
    }
    var noteHtml = st.note ? '<div class="tl-note">' + esc(st.note) + "</div>" : "";
    var onHtml = st.on ? '<div class="tl-date">Recorded ' + esc(fmtDate(st.on)) + "</div>" : "";
    return '<li class="tl-step ' + cls + '">' +
      '<span class="tl-line" aria-hidden="true"></span>' +
      '<span class="tl-dot">' + mark + "</span>" +
      '<div class="tl-body">' +
        '<span class="tl-date">' + esc(step.dateLabel) + "</span>" +
        '<span class="tl-title">' + esc(step.title) + "</span>" +
        '<span class="tl-desc">' + esc(step.body) + "</span>" +
        '<div class="tl-tags">' + tagsHtml + "</div>" +
        onHtml + noteHtml +
      "</div></li>";
  }).join("");
  return '<ol class="timeline">' + items + "</ol>";
}

function wireCurrentView(){
  if (STATE === "link-error") {
    var r = document.getElementById("btn-retry");
    if (r) r.addEventListener("click", boot);
  }
  if (STATE === "locked") wireLockedView();
  if (STATE === "review") wireReviewView();
  if (STATE === "signed") wireSignedView();
}

function startLockoutCountdown(untilMs){
  CTX.lockoutUntil = untilMs;
  render();
  clearInterval(CTX.lockoutTimer);
  CTX.lockoutTimer = setInterval(function () {
    var msLeft = CTX.lockoutUntil - Date.now();
    if (msLeft <= 0) { clearInterval(CTX.lockoutTimer); CTX.lockoutUntil = 0; render(); return; }
    var el = document.getElementById("lockout-cd");
    if (el) {
      var mm = Math.floor(msLeft / 60000), ss = Math.floor((msLeft % 60000) / 1000);
      el.textContent = "Try again in " + mm + ":" + pad2(ss);
    }
  }, 500);
}

function wireLockedView(){
  var input = document.getElementById("code-input");
  var btn = document.getElementById("btn-unlock");
  var errSlot = document.getElementById("lock-err");
  if (input) {
    input.addEventListener("input", function () {
      var raw = normalizeCodeInput(input.value).slice(0, 8);
      input.value = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
    });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
    var pre = qs.get("code"); if (pre) input.value = pre;
  }
  if (btn) btn.addEventListener("click", attempt);

  function attempt(){
    var code = input ? input.value.trim() : "";
    errSlot.textContent = "";
    btn.disabled = true;
    var origText = btn.textContent; btn.textContent = "Checking…";
    Portal.unlock(code).then(function (res) {
      CTX.viewerToken = res.viewerToken;
      storeToken(res.viewerToken);
      CTX.data = res.state;
      CTX.lockedBanner = "";
      goto(res.state.acceptance ? "signed" : "review");
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = origText;
      if (err.code === "resource-exhausted") {
        var mins = 15; var mm = /(\d+)\s*minute/.exec(err.message || ""); if (mm) mins = parseInt(mm[1], 10) || mins;
        startLockoutCountdown(Date.now() + mins * 60000);
      } else if (err.code === "not-found") {
        CTX.linkErrorText = err.message; goto("link-error");
      } else if (err.code === "unavailable" || err.code === "internal") {
        errSlot.textContent = "Something went wrong on our side — please try again in a moment.";
      } else {
        errSlot.textContent = err.message || "That access code isn't right.";
      }
    });
  }
}

function wireSignedView(){
  var pr = document.getElementById("btn-print-receipt");
  if (pr) pr.addEventListener("click", function () {
    document.body.classList.add("print-receipt");
    window.print();
  });
  window.addEventListener("afterprint", function () { document.body.classList.remove("print-receipt"); });
  var cp = document.getElementById("btn-copy-ref");
  if (cp) cp.addEventListener("click", function () {
    var ref = CTX.data.acceptance.refNo;

    cp.textContent = "Copied!";
    setTimeout(function () { cp.textContent = "Copy reference"; }, 1500);
  });
  var so = document.getElementById("btn-signout");
  if (so) so.addEventListener("click", function () { clearToken(); CTX.data = null; goto("locked"); });
}

function wireReviewView(){
  var $ = function (id) { return document.getElementById(id); };

  var showTerms = $("btn-show-terms");
  if (showTerms) showTerms.addEventListener("click", function () {
    var more = $("terms-more"); var willShow = more.hidden;
    more.hidden = !willShow; showTerms.textContent = willShow ? "Show fewer terms" : "Show all terms";
  });

  var openSign = $("btn-open-sign");
  if (openSign) openSign.addEventListener("click", function () {
    CTX.signSheetOpen = true;
    var sheet = $("sign-sheet"); sheet.hidden = false;
    sheet.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  var sheet = $("sign-sheet");
  if (!sheet) return; // expired — no sign sheet in the DOM at all

  var sigPad = initSignaturePad($("sig-canvas"), $("sig-box"), $("sig-hint"), $("sig-size"));
  var fields = ["f-name", "f-email", "f-mobile", "f-designation", "f-company", "f-typedname"];
  fields.forEach(function (id) { $(id).addEventListener("input", function () { validateField(id); updateSubmitEnabled(); }); });
  ["chk-scope", "chk-price", "chk-terms", "chk-payment", "privacy-consent"].forEach(function (id) {
    var el = $(id); if (el) el.addEventListener("change", updateSubmitEnabled);
  });

  $("btn-sig-typed").addEventListener("click", function () { switchSigMode("typed"); });
  $("btn-sig-drawn").addEventListener("click", function () { switchSigMode("drawn"); });
  $("btn-sig-clear").addEventListener("click", function () { sigPad.clear(); updateSubmitEnabled(); });
  $("btn-sig-undo").addEventListener("click", function () { sigPad.undo(); updateSubmitEnabled(); });
  sigPad.onChange = updateSubmitEnabled;

  function switchSigMode(mode){
    CTX.signatureMode = mode;
    $("sig-drawn-panel").hidden = mode !== "drawn";
    $("sig-typed-panel").hidden = mode !== "typed";
    updateSubmitEnabled();
  }

  function validateField(id){
    var el = $(id); var errEl = $("err-" + id.replace(/^f-/, ""));
    var v = el.value.trim(); var msg = "";
    if (!v) msg = "This field is required.";
    else if (id === "f-email" && !isValidEmail(v)) msg = "Enter a valid email address.";
    else if (id === "f-mobile" && v.replace(/\D/g, "").length < 6) msg = "Enter a valid mobile number.";
    else if (id === "f-typedname" && !namesMatch(v, $("f-name").value)) msg = "This must match your full name above.";
    el.setAttribute("aria-invalid", msg ? "true" : "false");
    if (errEl) errEl.textContent = msg;
    return !msg;
  }
  function namesMatch(a, b){ return String(a || "").trim().toLowerCase().replace(/\s+/g, " ") === String(b || "").trim().toLowerCase().replace(/\s+/g, " "); }

  function updateSubmitEnabled(){
    var typedPreview = $("sig-typed-preview-text");
    if (typedPreview) typedPreview.textContent = $("f-typedname").value.trim() || " ";

    var allFieldsOk = fields.every(function (id) {
      var v = $(id).value.trim();
      if (!v) return false;
      if (id === "f-email") return isValidEmail(v);
      if (id === "f-mobile") return v.replace(/\D/g, "").length >= 6;
      if (id === "f-typedname") return namesMatch(v, $("f-name").value);
      return true;
    });
    var agreesOk = ["chk-scope", "chk-price", "chk-terms", "chk-payment"].every(function (id) { return $(id).checked; });
    var privacyOk = $("privacy-consent").checked;
    var sigOk = CTX.signatureMode === "typed" ? true : (!sigPad.isEmpty() && sigPad.pointCount() >= 40);

    $("err-agree").textContent = "";
    $("err-privacy").textContent = "";
    $("err-signature").textContent = "";
    var sizeLabel = $("sig-size");
    if (sizeLabel) sizeLabel.textContent = (CTX.signatureMode === "drawn" && !sigPad.isEmpty()) ? "~" + Math.round(sigPad.approxBytes() / 1024) + " KB" : "";

    $("btn-submit").disabled = !(allFieldsOk && agreesOk && privacyOk && sigOk);
  }

  $("btn-submit").addEventListener("click", function () {
    var okFields = fields.every(validateField);
    var agreesOk = ["chk-scope", "chk-price", "chk-terms", "chk-payment"].every(function (id) { return $(id).checked; });
    var privacyOk = $("privacy-consent").checked;
    var sigOk = CTX.signatureMode === "typed" ? true : (!sigPad.isEmpty() && sigPad.pointCount() >= 40);
    if (!agreesOk) $("err-agree").textContent = "Please check all four agreement boxes to continue.";
    if (!privacyOk) $("err-privacy").textContent = "Please consent to the data privacy notice to continue.";
    if (!sigOk) $("err-signature").textContent = "Please draw your signature (or switch to typing your name).";
    if (!okFields || !agreesOk || !privacyOk || !sigOk) {
      $("err-form").textContent = "Please fix the highlighted fields above before submitting.";
      return;
    }
    $("err-form").textContent = "";

    var submitBtn = $("btn-submit");
    submitBtn.disabled = true;
    var origText = submitBtn.textContent; submitBtn.textContent = "Signing…";

    exportSignature(sigPad).then(function (signaturePng) {
      var payload = {
        portalId: PORTAL_ID, viewerToken: CTX.viewerToken,
        signer: { name: $("f-name").value.trim(), email: $("f-email").value.trim(), phone: $("f-mobile").value.trim(), designation: $("f-designation").value.trim(), company: $("f-company").value.trim() },
        typedName: $("f-typedname").value.trim(),
        signatureMode: CTX.signatureMode, signaturePng: CTX.signatureMode === "drawn" ? signaturePng : null,
        agreements: { scope: $("chk-scope").checked, price: $("chk-price").checked, terms: $("chk-terms").checked, payment: $("chk-payment").checked },
        privacy: { consent: true, noticeVersion: CTX.data.privacyNotice.version }
      };
      return Portal.sign(payload);
    }).then(function (res) {
      CTX.data = res.state; CTX.freshlySigned = true; CTX.lastReceipt = res.receipt;
      goto("signed");
    }).catch(function (err) {
      submitBtn.disabled = false; submitBtn.textContent = origText;
      if (err.code === "unauthenticated") {
        clearToken(); CTX.lockedBanner = "Your session ended — enter your code again."; goto("locked"); return;
      }
      if (err.code === "failed-precondition") {
        // "Reload to state" per spec §5.3 — e.g. already-signed races to SIGNED.
        Portal.loadState(CTX.viewerToken).then(function (r) {
          CTX.data = r.state;
          goto(r.state.acceptance ? "signed" : "review");
        }).catch(function () { $("err-form").textContent = err.message; });
        return;
      }
      $("err-form").textContent = (err.code === "unavailable" || err.code === "internal")
        ? "Something went wrong on our side — please try again in a moment."
        : (err.message || "We couldn't record your signature. Please try again.");
    });
  });

  updateSubmitEnabled();
}

/* ============================================================================
   9. SIGNATURE CANVAS — mouse, touch and stylus via the unified Pointer
   Events API, correctly scaled for retina displays.
   ========================================================================= */
function initSignaturePad(canvas, box, hintEl, sizeEl){
  var ctx = canvas.getContext("2d");
  var strokes = [];
  var current = null;
  var drawing = false;

  // RETINA MATH: a <canvas> has two independent sizes — its CSS box (from the
  // stylesheet, read via getBoundingClientRect()) and its backing pixel buffer
  // (canvas.width/height). Setting only the CSS size makes the browser stretch
  // a low-res buffer to fit, so strokes look blurry. Instead we size the
  // buffer to CSS-size × devicePixelRatio (crisp on retina), then call
  // ctx.setTransform(dpr,0,0,dpr,0,0) so every drawing command can still be
  // issued in plain CSS-pixel coordinates — exactly what getBoundingClientRect()
  // gives pointer events below. Skipping that setTransform is exactly what
  // produces the classic "signature lands offset from the cursor" bug.
  function resize(){
    var rect = box.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function pointFromEvent(e){
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.lineWidth = 2.5;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink") || "#1B2226";
    strokes.forEach(drawStroke);
    if (hintEl) hintEl.style.display = strokes.length ? "none" : "flex";
  }
  function drawStroke(pts){
    if (pts.length < 2) {
      if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 1.3, 0, Math.PI * 2); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); }
      return;
    }
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  function down(e){
    // touch-action:none on the canvas (see CSS) stops the page panning while a
    // finger/pen is on the pad; every other part of the page keeps scrolling
    // normally since that rule is scoped to just this element.
    drawing = true;
    current = [pointFromEvent(e)];
    strokes.push(current);
    try { canvas.setPointerCapture(e.pointerId); } catch (_e) { /* defensive: a real pointerdown always has an active session, but guard anyway */ }
    redraw();
  }
  function move(e){ if (drawing) { current.push(pointFromEvent(e)); redraw(); } }
  function up(e){
    if (!drawing) return;
    drawing = false; current = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_e) {}
    if (pad.onChange) pad.onChange();
  }
  canvas.addEventListener("pointerdown", down);
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("pointerleave", function (e) { if (drawing) up(e); });
  window.addEventListener("resize", resize);
  resize();

  var pad = {
    onChange: null,
    clear: function () { strokes = []; redraw(); },
    undo: function () { strokes.pop(); redraw(); },
    isEmpty: function () { return strokes.length === 0; },
    pointCount: function () { return strokes.reduce(function (n, s) { return n + s.length; }, 0); },
    canvasEl: canvas,
    toDataUrl: function () { return canvas.toDataURL("image/png"); },
    approxBytes: function () {
      if (this.isEmpty()) return 0;
      var b64 = this.toDataUrl().split(",")[1] || "";
      return Math.round(b64.length * 3 / 4);
    }
  };
  return pad;
}

// Export the drawn signature as a PNG data URL; per spec §5.6, if it exceeds
// 200 KB, downscale by 0.75 and retry (max 3×) before submit — keeps a huge
// retina buffer from producing an oversized field for the acceptance doc.
function exportSignature(sigPad){
  return new Promise(function (resolve) {
    var url = sigPad.toDataUrl();
    var tries = 0;
    var srcCanvas = sigPad.canvasEl;
    function bytes(u){ return Math.round(((u.split(",")[1] || "").length) * 3 / 4); }
    function shrink(canvas, scale){
      var out = document.createElement("canvas");
      out.width = Math.max(1, Math.round(canvas.width * scale));
      out.height = Math.max(1, Math.round(canvas.height * scale));
      var octx = out.getContext("2d");
      octx.drawImage(canvas, 0, 0, out.width, out.height);
      return out;
    }
    var workingCanvas = srcCanvas;
    while (bytes(url) > 200000 && tries < 3) {
      workingCanvas = shrink(workingCanvas, 0.75);
      url = workingCanvas.toDataURL("image/png");
      tries++;
    }
    resolve(url);
  });
}

/* Global helper mirroring spec §5's expectation that the resolved signature
   is reachable as a plain PNG data URL for backend/QA inspection. */
window.getSignatureDataUrl = function () {
  var c = document.getElementById("sig-canvas");
  return c ? c.toDataURL("image/png") : null;
};

boot();
})();
</script>

name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check on every js/*.js and scripts/*.js
        run: |
          set -e
          fail=0
          for f in js/*.js scripts/*.js; do
            echo "checking $f"
            node --check "$f" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more files failed node --check"
            exit 1
          fi

  money-math-tests:
    name: Money-math + geofencing tests (vatSplit, computeStatutory, computePayLine, haversineMeters, siteMatch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Explicit glob, not bare `node --test tests/` — the directory-argument
      # form throws MODULE_NOT_FOUND on current Node (verified on v24.16.0);
      # `node --test tests/*.test.mjs` (or bare `node --test`) is what actually
      # works across versions. Keep this in sync with the "Run with:" comment
      # in each tests/*.test.mjs file header.
      - name: node --test tests/*.test.mjs
        run: node --test tests/*.test.mjs

  node-version-pin:
    name: All workflow node-version entries must be '22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check node-version pins
        shell: python
        run: |
          import glob, re, sys
          fail = False
          for f in glob.glob('.github/workflows/*.yml'):
              if f.endswith('ci.yml'):
                  continue
              for m in re.finditer(r"node-version:\s*['\"]?([^'\"\s,}#]+)", open(f).read()):
                  if m.group(1) != '22':
                      print(f"::error::{f} pins node-version '{m.group(1)}' (must be 22)")
                      fail = True
          if fail:
              sys.exit(1)
          print('All node-version entries are pinned to 22')

  backup-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backup coverage
        run: node scripts/check-backup-coverage.js

  ui-wiring:
    name: UI-wiring guard (onclick -> window global, id lookups)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UI wiring
        run: node scripts/check-ui-wiring.js

  invariants:
    name: Invariant guards (z-index stacking incl. css/, sw.js PRECACHE completeness, CACHE_VER == APP_VERSION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stacking + PRECACHE invariants
        run: bash scripts/ci-invariants.sh
